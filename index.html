<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>双级螺杆压缩机 V1.1</title>
<style>
  html,body{margin:0;min-height:100%;font-family:"Microsoft YaHei",system-ui,sans-serif;background:#edf5ef;}
  #pwOverlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#edf5ef;z-index:10;}
  .pwBox{background:#fff;border-radius:10px;box-shadow:0 8px 30px rgba(20,83,45,.15);padding:28px 32px;width:330px;border-top:4px solid #16a34a;}
  .pwBox h2{margin:0 0 6px;font-size:16px;color:#14532d;}
  .pwTip{font-size:12px;color:#6b7280;margin-bottom:14px;}
  .pwBox input[type=password]{width:100%;box-sizing:border-box;padding:9px 12px;font-size:14px;border:1px solid #d1d5db;border-radius:6px;outline:none;}
  .pwBox input[type=password]:focus{border-color:#16a34a;box-shadow:0 0 0 3px rgba(22,163,74,.15);}
  .pwErr{color:#dc2626;font-size:12px;min-height:16px;margin:6px 0 0;}
  .pwBtns{display:flex;gap:10px;margin-top:14px;justify-content:flex-end;}
  .pwBtns button{padding:7px 22px;font-size:14px;border-radius:6px;border:1px solid #d1d5db;cursor:pointer;background:#fff;}
  .pwBtns .ok{background:#16a34a;border-color:#16a34a;color:#fff;}
  .pwBtns .ok:hover{background:#15803d;border-color:#15803d;}
  #encPanel{max-width:880px;margin:40px auto;background:#fff;border-radius:10px;padding:24px 28px;box-shadow:0 8px 30px rgba(0,0,0,.10);}
  #encPanel h2{margin:0 0 10px;font-size:16px;}
  #encPanel textarea{width:100%;box-sizing:border-box;height:300px;font-family:Consolas,monospace;font-size:12px;padding:10px;border:1px solid #d1d5db;border-radius:6px;}
  #encPanel .row{margin:12px 0;display:flex;gap:10px;align-items:center;}
  #encPanel input[type=password]{flex:1;padding:8px 12px;border:1px solid #d1d5db;border-radius:6px;font-size:14px;}
  #encPanel button{padding:8px 18px;background:#16a34a;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:14px;}
  #encPanel button:hover{background:#15803d;}
  #encMsg{font-size:12px;}
</style>
</head>
<body>
<div id="pwOverlay">
  <div class="pwBox">
    <div id="pwForm">
      <h2>双级螺杆压缩机 V1.1</h2>
      <div class="pwTip">此文件已加密，请输入密码后访问。</div>
      <input type="password" id="pwInput" placeholder="请输入密码" autocomplete="off">
      <div class="pwErr" id="pwErr"></div>
      <div class="pwBtns">
        <button id="pwCancel">取消</button>
        <button id="pwOk" class="ok">确定</button>
      </div>
    </div>
    <div id="pwCancelled" hidden>
      <h2>已取消</h2>
      <div class="pwTip">访问已取消，请关闭本页面。</div>
    </div>
  </div>
</div>

<div id="encPanel" hidden>
  <h2>加密器（维护模式，URL 带 #encrypt 进入）</h2>
  <p style="font-size:12px;color:#6b7280;margin:0 0 10px;">粘贴修改后的完整明文 HTML 源码，输入新密码，点击生成并下载加密版文件（文件名与当前文件一致，覆盖替换即可）。</p>
  <textarea id="encSrc" placeholder="粘贴完整明文 HTML 源码"></textarea>
  <div class="row">
    <input type="password" id="encPw" placeholder="新密码" autocomplete="off">
    <button id="encGo">生成加密文件</button>
  </div>
  <div id="encMsg"></div>
</div>

const ITER = 100000;
const te = new TextEncoder(), td = new TextDecoder();
function b2s(b64) { const s = atob(b64); const u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u; }
function s2b(buf) { const u8 = new Uint8Array(buf); let s = ""; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); }

async function derive(pw, salt) {
  const km = await crypto.subtle.importKey("raw", te.encode(pw), "PBKDF2", false, ["deriveBits"]);
  const bits = await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-1", salt: salt, iterations: ITER }, km, 384);
  return { key: bits.slice(0, 32), check: s2b(bits.slice(32, 48)) };
}
async function decrypt(pw) {
  if (!crypto.subtle) throw new Error("当前环境不支持 WebCrypto，请用最新版 Chrome / Edge 打开");
  const d = await derive(pw, b2s(PAYLOAD.salt));
  if (d.check !== PAYLOAD.check) throw new Error("密码错误");
  const aesKey = await crypto.subtle.importKey("raw", d.key, { name: "AES-CBC" }, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name: "AES-CBC", iv: b2s(PAYLOAD.iv) }, aesKey, b2s(PAYLOAD.data));
  return td.decode(plain);
}
async function tryUnlock() {
  const pwEl = document.getElementById("pwInput"), errEl = document.getElementById("pwErr");
  errEl.textContent = "";
  if (!pwEl.value) { errEl.textContent = "请输入密码"; return; }
  try {
    const html = await decrypt(pwEl.value);
    document.open(); document.write(html); document.close();
  } catch (e) {
    errEl.textContent = (e.message === "密码错误") ? "密码错误，请重试" : ("解密失败：" + e.message);
    pwEl.select();
  }
}
document.getElementById("pwOk").addEventListener("click", tryUnlock);
document.getElementById("pwInput").addEventListener("keydown", function (e) { if (e.key === "Enter") tryUnlock(); });
document.getElementById("pwCancel").addEventListener("click", function () {
  document.getElementById("pwForm").hidden = true;
  document.getElementById("pwCancelled").hidden = false;
});

/* ---------- 加密器（维护模式） ---------- */
async function encryptHtml(plain, pw) {
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(16));
  const d = await derive(pw, salt);
  const aesKey = await crypto.subtle.importKey("raw", d.key, { name: "AES-CBC" }, false, ["encrypt"]);
  const cipher = await crypto.subtle.encrypt({ name: "AES-CBC", iv: iv }, aesKey, te.encode(plain));
  return { v: 1, kdf: "PBKDF2-SHA1", iter: ITER, salt: s2b(salt), check: d.check, iv: s2b(iv), data: s2b(cipher) };
}
if (location.hash === "#encrypt") {
  document.getElementById("pwOverlay").hidden = true;
  document.getElementById("encPanel").hidden = false;
  document.getElementById("encGo").addEventListener("click", async function () {
    const plain = document.getElementById("encSrc").value;
    const pw = document.getElementById("encPw").value;
    const msg = document.getElementById("encMsg");
    if (!plain || !pw) { msg.style.color = "#dc2626"; msg.textContent = "明文源码和新密码都不能为空"; return; }
    try {
      const payload = await encryptHtml(plain, pw);
      const root = document.documentElement.cloneNode(true);
      root.querySelector("#encPanel").setAttribute("hidden", "");
      root.querySelector("#pwOverlay").removeAttribute("hidden");
      root.querySelector("#pwForm").removeAttribute("hidden");
      root.querySelector("#pwCancelled").setAttribute("hidden", "");
      root.querySelector("#pwErr").textContent = "";
      let out = "<!DOCTYPE html>\n" + root.outerHTML;
      out = out.replace(/const PAYLOAD = \{[\s\S]*?\};/, "const PAYLOAD = " + JSON.stringify(payload) + ";");
      if (out.indexOf(JSON.stringify(payload)) < 0) throw new Error("模板替换失败");
      const blob = new Blob([out], { type: "text/html;charset=utf-8" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "2stage screw calculation.html";
      a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 5000);
      msg.style.color = "#059669"; msg.textContent = "已生成加密文件，请在浏览器下载目录中查看。";
    } catch (e) {
      msg.style.color = "#dc2626"; msg.textContent = "生成失败：" + e.message;
    }
  });
}
